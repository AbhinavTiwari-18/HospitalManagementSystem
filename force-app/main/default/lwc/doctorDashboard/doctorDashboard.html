<template>

    <lightning-card title="Doctor Dashboard">

        <div class="slds-p-around_medium">

            <!-- Doctor Search -->
            <lightning-input
                type="text"
                label="Search Doctor"
                placeholder="Enter Doctor Name"
                value={doctorName}
                onchange={handleDoctorChange}>
            </lightning-input>

            <!-- Suggestions -->
            <template if:true={showSuggestions}>

                <div class="slds-box slds-theme_default">

                    <template
                        for:each={doctorSuggestions}
                        for:item="doctor">

                        <div
                            key={doctor.Id}
                            class="suggestion-item slds-p-around_small"
                            data-id={doctor.Id}
                            data-name={doctor.Name}
                            onclick={handleDoctorSelect}>

                            {doctor.Name}

                        </div>

                    </template>

                </div>

            </template>

        </div>

        <!-- Appointment Table -->
        <template if:true={appointments}>

            <lightning-datatable
                key-field="Id"
                data={appointments}
                columns={columns}
                onrowaction={handleRowAction}
                hide-checkbox-column>
            </lightning-datatable>

        </template>

        <!-- No Records -->
        <template if:true={noRecords}>

            <div class="slds-p-around_medium">

                No Upcoming Appointments Found

            </div>

        </template>

        <!-- Cancel Modal -->
        <template if:true={showModal}>

            <section
                role="dialog"
                tabindex="-1"
                class="slds-modal slds-fade-in-open">

                <div class="slds-modal__container">

                    <!-- Header -->
                    <header class="slds-modal__header">

                        <h2 class="slds-text-heading_medium">

                            Cancel Appointment

                        </h2>

                    </header>

                    <!-- Body -->
                    <div
                        class="slds-modal__content slds-p-around_medium">

                        <lightning-textarea
                            label="Cancellation Reason"
                            placeholder="Enter Reason"
                            value={cancelReason}
                            onchange={handleReasonChange}>
                        </lightning-textarea>

                    </div>

                    <!-- Footer -->
                    <footer class="slds-modal__footer">

                        <lightning-button
                            label="Close"
                            onclick={closeModal}>
                        </lightning-button>

                        <lightning-button
                            variant="destructive"
                            label="Confirm Cancel"
                            onclick={confirmCancel}>
                        </lightning-button>

                    </footer>

                </div>

            </section>

            <div class="slds-backdrop slds-backdrop_open"></div>

        </template>

    </lightning-card>

</template>
