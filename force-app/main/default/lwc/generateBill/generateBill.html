<template>
    lightning-card title="Generate Bill">

        <div class="slds-var-p-around_medium">
            <lightning-input type="text"
                label="Patient Name"
                value={patientName}
                onchange={handlePatientChange}>
            </lightning-input>

            <lightning-input type="number"
                label="Amount"
                value={amount}
                onchange={handleAmountChange}>
            </lightning-input>

            <lightning-button label="Generate Bill"
                onclick={generateBill}
                class="slds-m-top_medium">
            </lightning-button>
        </div>
</template>
